name: Refresh market dashboard

# 每约30分钟自动取最新数据、重建仪表盘、覆盖式发布到 gh-pages（历史只保留1个提交，不撑大仓库）。
# 也可在 Actions 页手动点 "Run workflow"。
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: python dashboard.py

      - name: Stage output as index.html
        run: |
          mkdir -p public
          cp dashboard.html public/index.html

      - name: Publish to gh-pages (single rolling commit)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
